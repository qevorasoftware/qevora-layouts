<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-labelledby="section-faq-title"><title id="section-faq-title">Frequently asked questions section preview: a heading with three collapsible question blocks.</title><rect width="400" height="220" fill="#ffffff"/><rect x="0.5" y="0.5" width="399" height="219" fill="none" stroke="#dcdcde"/><text x="200" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d2327" text-anchor="middle">Frequently asked questions</text><rect x="40" y="58" width="320" height="34" rx="4" fill="#f6f7f7"/><text x="56" y="80" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#1d2327" text-anchor="start">How do I show this section on a page?</text><text x="344" y="80" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#50575e" text-anchor="end">+</text><rect x="40" y="100" width="320" height="34" rx="4" fill="#f6f7f7"/><text x="56" y="122" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#1d2327" text-anchor="start">Can I use a page builder instead?</text><text x="344" y="122" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#50575e" text-anchor="end">+</text><rect x="40" y="142" width="320" height="34" rx="4" fill="#ffffff"/><rect x="40.5" y="142.5" width="319" height="33" rx="4" fill="#ffffff" stroke="#dcdcde"/><text x="56" y="164" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#1d2327" text-anchor="start">Does importing overwrite my layouts?</text><text x="344" y="164" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#50575e" text-anchor="end">+</text><text x="16" y="200